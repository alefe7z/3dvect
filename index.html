<title>Vértice 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: CAD workstation — menubar, command line, toolbar, [tool rail | 4 viewports | side panel], osnap bar, status bar */
:root{
  --chrome:#e4e7eb; --panel:#f3f4f6; --raised:#ffffff; --line:#c9ced6; --line-soft:#dde1e6;
  --fg:#1c2026; --muted:#5b6472; --accent:#0d7480; --accent-fg:#ffffff; --accent-soft:#d3eaec;
  --sel:#e9a100; --err:#b3261e; --ok:#2f7d32;
  --vp-bg:#c3c9d1; --vp-bg-persp:#b9c0c9; --grid-minor:#adb4be; --grid-major:#959da9; --axis-x:#c0392b; --axis-y:#2e8b45; --axis-z:#2f5fd0;
  --label-bg:rgba(255,255,255,.72);
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#1a1d21; --panel:#212429; --raised:#2a2e34; --line:#363b43; --line-soft:#2d3138;
  --fg:#e2e5e9; --muted:#97a0ac; --accent:#3fb5c0; --accent-fg:#0d1a1c; --accent-soft:#18383c;
  --sel:#f2b01e; --err:#f08b84; --ok:#7bc47f;
  --vp-bg:#2b3036; --vp-bg-persp:#30363d; --grid-minor:#3a4048; --grid-major:#4b525c; --axis-x:#e0594b; --axis-y:#4fb267; --axis-z:#5b86e6;
  --label-bg:rgba(26,29,33,.72); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --chrome:#1a1d21; --panel:#212429; --raised:#2a2e34; --line:#363b43; --line-soft:#2d3138;
  --fg:#e2e5e9; --muted:#97a0ac; --accent:#3fb5c0; --accent-fg:#0d1a1c; --accent-soft:#18383c;
  --sel:#f2b01e; --err:#f08b84; --ok:#7bc47f;
  --vp-bg:#2b3036; --vp-bg-persp:#30363d; --grid-minor:#3a4048; --grid-major:#4b525c; --axis-x:#e0594b; --axis-y:#4fb267; --axis-z:#5b86e6;
  --label-bg:rgba(26,29,33,.72); color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;min-width:0}

/* menubar */
#menubar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;scrollbar-width:none}
#brand{display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.02em;margin-right:10px;white-space:nowrap}
#brand svg{width:18px;height:18px;color:var(--accent)}
.menu{position:relative}
.menu>button{background:none;border:0;padding:5px 8px;border-radius:var(--r);white-space:nowrap}
.menu>button:hover,.menu.open>button{background:var(--line-soft)}
#docname{margin-left:auto;color:var(--muted);white-space:nowrap;padding-left:12px;font-family:var(--f-mono);font-size:12px}
.dropdown{position:fixed;z-index:50;min-width:220px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;max-height:70vh;overflow:auto}
.dropdown button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;background:none;border:0;text-align:left;padding:5px 8px;border-radius:3px}
.dropdown button:hover,.dropdown button.on{background:var(--accent-soft)}
.dropdown button kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dropdown hr{border:0;border-top:1px solid var(--line-soft);margin:4px 2px}
.dropdown .chk{width:14px;color:var(--accent)}

/* command area */
#cmdarea{background:var(--raised);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;position:relative}
#history{height:58px;overflow-y:auto;padding:4px 10px 0;color:var(--muted);white-space:pre-wrap}
#history .cmd{color:var(--fg)}
#history .err{color:var(--err)}
#history .ok{color:var(--ok)}
#history .res{color:var(--accent)}
#cmdline{display:flex;align-items:center;gap:6px;padding:3px 10px 5px;min-width:0;flex-wrap:wrap}
#prompt{white-space:nowrap;color:var(--fg)}
#opts{display:flex;gap:4px;flex-wrap:wrap}
#opts button{border:0;background:none;color:var(--accent);padding:0 3px;text-decoration:underline;text-underline-offset:2px;font-family:var(--f-mono);font-size:12px}
#cmd{flex:1;min-width:140px;border:0;background:transparent;outline:none;padding:2px 0}
#ac{position:absolute;left:10px;top:100%;z-index:40;list-style:none;margin:0;padding:3px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:300px;max-width:calc(100vw - 20px)}
#ac li{display:flex;gap:10px;padding:3px 8px;border-radius:3px;cursor:pointer;font-family:var(--f-ui);font-size:13px}
#ac li b{font-family:var(--f-mono);font-weight:500;font-size:12px;min-width:120px}
#ac li span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ac li.on{background:var(--accent-soft)}

/* toolbar */
#toolbar{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.ib{flex:none;width:30px;height:30px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:var(--r);color:var(--fg);padding:0}
.ib:hover{background:var(--raised);border-color:var(--line)}
.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib svg .f{fill:currentColor;stroke:none}
.ib svg .fs{fill:currentColor;fill-opacity:.25}

/* workspace */
#workspace{display:grid;grid-template-columns:auto minmax(0,1fr) 272px;min-height:0;min-width:0}
#tools{display:grid;grid-template-columns:repeat(2,30px);align-content:start;gap:2px;padding:6px 4px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#tools .grp{grid-column:1/-1;font-size:9px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:clip;color:var(--muted);padding:6px 2px 1px}
#views{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:3px;background:var(--line);min-height:0;min-width:0}
#views.max{grid-template-columns:1fr;grid-template-rows:1fr}
#views.max .vp:not(.maxed){display:none}
.vp{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--vp-bg);outline:1px solid transparent}
.vp.active{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.vp canvas{display:block;width:100%;height:100%;touch-action:none}
.vp-label{position:absolute;left:6px;top:6px;z-index:2;display:flex;gap:4px;align-items:center;background:var(--label-bg);border:1px solid var(--line);border-radius:var(--r);padding:2px 8px;font-size:12px;font-weight:500;backdrop-filter:blur(4px)}
.vp-label small{color:var(--muted);font-weight:400}
.vp.active .vp-label{border-color:var(--accent)}
.vp-axes{position:absolute;left:8px;bottom:8px;width:54px;height:54px;pointer-events:none;z-index:2}
.vp-axes text{font:600 10px var(--f-mono)}
.snapmark{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-50%)}
.snapmark i{display:block;width:10px;height:10px;border:2px solid var(--sel);background:transparent}
.snapmark span{position:absolute;left:12px;top:-14px;font:500 11px var(--f-mono);background:var(--raised);color:var(--fg);border:1px solid var(--line);padding:0 4px;border-radius:2px;white-space:nowrap}
.selrect{position:absolute;z-index:3;pointer-events:none;border:1px solid var(--fg);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.selrect.cross{border-style:dashed;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.crosshair{position:absolute;inset:0;pointer-events:none;z-index:2}

/* side panel */
#panel{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0;min-width:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:7px 4px;color:var(--muted);font-weight:500}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabpane{flex:1;overflow:auto;padding:10px 12px;min-height:0}
.tabpane h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px;font-weight:600}
.tabpane h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 8px;align-items:center}
.kv label,.kv .k{color:var(--muted)}
.kv .v{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv input[type=text],.kv select{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:3px;padding:3px 6px;min-width:0}
.kv input[type=color]{width:100%;height:24px;border:1px solid var(--line);border-radius:3px;background:var(--raised);padding:1px}
.empty{color:var(--muted);line-height:1.5}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#layers{width:100%;border-collapse:collapse}
#layers td{padding:3px 2px;border-bottom:1px solid var(--line-soft)}
#layers tr.cur td{background:var(--accent-soft)}
#layers .nm{width:100%}
#layers .nm input{width:100%;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:3px;min-width:0}
#layers .nm input:focus{border-color:var(--line);background:var(--raised)}
.mini{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;border-radius:3px;padding:0;color:var(--muted)}
.mini:hover{background:var(--raised);color:var(--fg)}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mini.off{opacity:.45}
.swatch{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);position:relative;overflow:hidden;display:block}
.swatch input{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:28px;height:28px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:block;margin:auto}
tr.cur .dot{background:var(--accent);border-color:var(--accent)}
#cmdsearch{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:3px;padding:5px 8px;margin-bottom:6px}
.cmdgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 3px;font-weight:600}
.cmditem{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;width:100%;background:none;border:0;text-align:left;padding:4px 4px;border-radius:3px}
.cmditem:hover{background:var(--raised)}
.cmditem svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.cmditem svg .f{fill:currentColor;stroke:none}.cmditem svg .fs{fill:currentColor;fill-opacity:.25}
.cmditem b{font-weight:500}
.cmditem code{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:4px}
.cmditem span{display:block;color:var(--muted);font-size:12px;line-height:1.3}

/* osnap + status */
#osnapbar{display:flex;gap:2px 12px;align-items:center;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;font-size:12px;white-space:nowrap}
#osnapbar label{display:flex;gap:4px;align-items:center;cursor:pointer}
#osnapbar input{accent-color:var(--accent);margin:0}
#osnapbar .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;margin-right:2px}
#status{display:flex;align-items:stretch;background:var(--chrome);border-top:1px solid var(--line);font-size:12px;overflow-x:auto;white-space:nowrap;padding-bottom:env(safe-area-inset-bottom,0px)}
#status>*{flex:none;padding:4px 10px;border-right:1px solid var(--line)}
#coords{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:240px}
#status button{background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-weight:500}
#status button.on{color:var(--fg);background:var(--accent-soft)}
#selinfo{color:var(--muted);margin-left:auto;border-left:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--fg);color:var(--chrome);padding:7px 14px;border-radius:var(--r);z-index:60;font-size:13px;max-width:calc(100vw - 32px)}
#paneltoggle{display:none}

@media (max-width:820px){
  #workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #tools{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:30px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:3px 6px}
  #tools .grp{display:none}
  #views{grid-template-columns:1fr;grid-template-rows:1fr}
  #views .vp:not(.maxed){display:none}
  #panel{position:fixed;right:0;top:0;bottom:0;width:min(320px,88vw);z-index:45;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 24px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
  #panel.open{transform:none}
  #paneltoggle{display:grid}
  #history{height:38px}
  #coords{min-width:0}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

</div>

/* =========================================================

   ========================================================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const toV = a => new THREE.Vector3(a[0], a[1], a[2]);
const rnd = n => Math.abs(n) < 1e-10 ? 0 : Math.round(n * 1e9) / 1e9;
const toA = v => [rnd(v.x), rnd(v.y), rnd(v.z)];
const CANCEL = Symbol('cancel');
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const fmt = (n, d = 3) => { if (!isFinite(n)) return '—'; let s = (Math.abs(n) < 1e-9 ? 0 : n).toFixed(d); if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s; };
const fmtV = v => `${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}`;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* =========================================================
   Curvas — definições serializáveis
   polyline {pts, closed} | nurbs {pts, degree, closed} | interp {pts, closed} | conic {c,u,v,a0,a1}
   ========================================================= */
function isClosedDef(def) {
  if (def.type === 'conic') return Math.abs(def.a1 - def.a0) >= TAU - 1e-9;
  return !!def.closed;
}

function deBoor(k, t, knots, ctrl, d) {
  const dp = [];
  for (let j = 0; j <= d; j++) dp[j] = ctrl[j + k - d].clone();
  for (let r = 1; r <= d; r++) {
    for (let j = d; j >= r; j--) {
      const i = j + k - d;
      const den = knots[i + d - r + 1] - knots[i];
      const a = den === 0 ? 0 : (t - knots[i]) / den;
      dp[j].multiplyScalar(a).addScaledVector(dp[j - 1], 1 - a);
    }
  }
  return dp[d];
}

function bspline(P, degree, closed, samples) {
  if (P.length < 2) return P.map(p => p.clone());
  let ctrl = P.map(p => p.clone());
  let d = Math.min(degree, closed ? P.length - 1 : P.length - 1);
  if (d < 1) d = 1;
  if (closed) ctrl = ctrl.concat(P.slice(0, d).map(p => p.clone()));
  const n = ctrl.length;
  const knots = [];
  let t0, t1;
  if (closed) {
    for (let i = 0; i < n + d + 1; i++) knots.push(i);
    t0 = d; t1 = n;
  } else {
    for (let i = 0; i < n + d + 1; i++) knots.push(i <= d ? 0 : i >= n ? n - d : i - d);
    t0 = 0; t1 = n - d;
  }
  const out = [];
  for (let s = 0; s <= samples; s++) {
    const t = t0 + (t1 - t0) * s / samples;

cmd('Deslocar', { label: 'Deslocar curva', alias: ['Offset', 'OffsetCrv'], cat: 'Curva', icon: 'offset', desc: 'Cria uma cópia paralela da curva a uma distância.' }, async () => {
  const [r] = await getObjects('Selecione a curva para deslocar', isCurve, { max: 1 });
  const d = Math.abs(await getNumber('Distância de deslocamento', last.offset)); last.offset = d;
  const S = sampleCurve(r.def), closed = isClosedDef(r.def);
  const pl = curvePlane(S); const n = pl && pl.planar && pl.area > 1e-9 ? pl.n : cpA().n;
  const offsetAt = (side) => {
    if (r.def.type === 'conic') {
      const u = toV(r.def.u), v = toV(r.def.v), k = 1 + side * d / Math.max(u.length(), 1e-9);
      if (k <= 0) return null;
      return { ...r.def, u: toA(u.multiplyScalar(k)), v: toA(v.multiplyScalar(1 + side * d / Math.max(toV(r.def.v).length(), 1e-9))) };
    }
    const P = r.def.type === 'polyline' ? r.def.pts.map(toV) : (closed ? S.slice(0, -1) : S);
    const m = P.length, out = [];
    for (let i = 0; i < m; i++) {
      const prev = P[(i - 1 + m) % m], next = P[(i + 1) % m], cur = P[i];
      const segN = (a, b) => new THREE.Vector3().crossVectors(b.clone().sub(a), n).normalize();
      let n1 = (closed || i > 0) ? segN(prev, cur) : null, n2 = (closed || i < m - 1) ? segN(cur, next) : null;
      let nv = n1 && n2 ? n1.clone().add(n2) : (n1 || n2).clone();
      if (nv.lengthSq() < 1e-12) nv = (n1 || n2).clone();
      nv.normalize();
      const cosh = n1 && n2 ? Math.max(0.2, nv.dot(n1)) : 1;
      out.push(cur.clone().addScaledVector(nv, side * d / cosh));
    }
    return { type: r.def.type === 'polyline' ? 'polyline' : 'interp', pts: out.map(toA), closed };
  };
  const sideOf = p => {
    if (r.def.type === 'conic') return p.distanceTo(toV(r.def.c)) > toV(r.def.u).length() ? 1 : -1;
    let bi = 0, bd = Infinity; S.forEach((q, i) => { const dd = q.distanceToSquared(p); if (dd < bd) { bd = dd; bi = i; } });
    const a = S[Math.max(0, bi - 1)], b = S[Math.min(S.length - 1, bi + 1)];
    const nn = new THREE.Vector3().crossVectors(b.clone().sub(a), n);
    return p.clone().sub(S[bi]).dot(nn) >= 0 ? 1 : -1;
  };
  const p = await getPoint('Lado para deslocar', { preview: q => { const dd = offsetAt(sideOf(q)); return dd && tmpCurve(dd); } });
  const def = offsetAt(sideOf(p)); if (!def) throw new Error('Distância maior que o raio.');
  addCurve(def, { layer: r.props.layer });
});
cmd('Unir', { alias: ['Join'], cat: 'Curva', icon: 'join', desc: 'Une curvas que se tocam pelas pontas em uma polilinha.' }, async () => {
  const recs = await getObjects('Selecione as curvas para unir', r => isCurve(r) && !isClosedDef(r.def), { min: 2 });
  const tol = 1e-3;
  const items = recs.map(r => ({ r, P: r.def.type === 'polyline' ? r.def.pts.map(toV) : sampleCurve(r.def).map(p => p.clone()) }));
  const used = new Set(); const chains = [];
  for (const it of items) {
    if (used.has(it)) continue; used.add(it);
    let chain = it.P.slice(), members = [it.r], grew = true;
    while (grew) {
      grew = false;
      for (const o of items) {
        if (used.has(o)) continue;
        const s = chain[0], e = chain[chain.length - 1], os = o.P[0], oe = o.P[o.P.length - 1];
        if (e.distanceTo(os) < tol) chain = chain.concat(o.P.slice(1));
        else if (e.distanceTo(oe) < tol) chain = chain.concat(o.P.slice().reverse().slice(1));
        else if (s.distanceTo(oe) < tol) chain = o.P.slice(0, -1).concat(chain);
        else if (s.distanceTo(os) < tol) chain = o.P.slice().reverse().slice(0, -1).concat(chain);
        else continue;
        used.add(o); members.push(o.r); grew = true;
      }
    }
    chains.push({ chain, members });
  }
  let joined = 0;
  for (const { chain, members } of chains) {
    if (members.length < 2) continue;
    const closed = chain[0].distanceTo(chain[chain.length - 1]) < tol;
    const pts = closed ? chain.slice(0, -1) : chain;
    members.forEach(removeRec);

    joined += members.length;
  }

  selectionChanged();
});

  if (op === ADDITION) { A = await getObjects('Selecione os sólidos para unir', isMesh, { min: 2 }); }
  else {
    A = await getObjects(op === SUBTRACTION ? 'Selecione os sólidos dos quais subtrair' : 'Selecione o primeiro conjunto', isMesh);
    sel.clear(); selectionChanged();
    B = await getObjects(op === SUBTRACTION ? 'Selecione os sólidos que serão subtraídos' : 'Selecione o segundo conjunto', isMesh, { preselect: false, exclude: A });
  }
  checkClosed(A.concat(B));
  log('Calculando…');
  await new Promise(r => setTimeout(r, 20));
  const g = booleanOp(A.map(r => r.geom), B.map(r => r.geom), op);
  if (!g) { log('A operação não produziu geometria (os objetos se tocam?).', 'err'); return; }
  const props = { ...A[0].props };
  const solid = A.concat(B).every(isSolid);
  A.concat(B).forEach(removeRec);
  const nr = addRec(makeRec('mesh', { geom: g, meta: solid ? { solid: true } : null }, props)); sel.clear(); sel.add(nr.id); selectionChanged();
  res('Operação booleana concluída.');
}

async function transformCmd(prompt, getMatrix, { copyDefault = false, allowCopy = true } = {}) {
  const recs = await getObjects(prompt, () => true);
  const ex = new Set(recs);
  const state = { copy: copyDefault };
  const m = await getMatrix(recs, ex, state);
  if (!m) return;
  const out = [];
  for (const r of recs) { const nr = transformedRec(r, m); if (state.copy) addRec(nr); else replaceRec(r, nr); out.push(nr); }
  sel.clear(); out.forEach(r => sel.add(r.id)); selectionChanged();
}

  return new THREE.Matrix4().makeTranslation(b.x - a.x, b.y - a.y, b.z - a.z);
}));

cmd('Girar', { alias: ['Rotate', 'Rotacionar'], cat: 'Transformar', icon: 'rotate', desc: 'Gira objetos em torno de um centro no plano da vista.' }, () => transformCmd('Selecione os objetos para girar', async (recs, ex, st) => {

async function scaleCmd(kind) {
  return transformCmd('Selecione os objetos para escalar', async (recs, ex, st) => {
    const cp = cpA();
    const b = await getPoint('Ponto base');
    let dir = null;
    const mat = s => {
      if (kind === '3d') return scaleM(b, s);
      if (kind === '1d') return linearAbout(b, dirScaleL(dir, s));
      const M = new THREE.Matrix4().makeScale(s, s, s); return linearAbout(b, M.multiply(dirScaleL(cp.n, 1 / s)));
    };
    let r1;
    for (;;) {
      r1 = await getPoint(kind === '1d' ? 'Primeiro ponto de referência (define a direção)' : 'Fator de escala ou primeiro ponto de referência', { base: b, numberOK: kind !== '1d', options: { Copiar: `Copiar=${yesNo(st.copy)}` } });
      if (r1.option) { st.copy = !st.copy; continue; } break;
    }
    if (r1.num !== undefined) { last.scale = r1.num; if (Math.abs(r1.num) < 1e-12) throw new Error('Fator zero.'); return mat(r1.num); }
    const d1 = r1.distanceTo(b); if (d1 < 1e-9) throw new Error('Referência coincide com a base.');
    if (kind === '1d') dir = r1.clone().sub(b).normalize();
    const factor = p => kind === '1d' ? p.clone().sub(b).dot(dir) / d1 : p.distanceTo(b) / d1;
    const r2 = await getPoint('Segundo ponto de referência', { base: b, numberOK: true, exclude: ex, preview: p => { const f = factor(p); return Math.abs(f) > 1e-9 && previewRecs(recs, mat(f)); } });
    const f = r2.num !== undefined ? r2.num : factor(r2);
    if (Math.abs(f) < 1e-12) throw new Error('Fator zero.');
    res(`Fator: ${fmt(f, 4)}`);
    return mat(f);
  });
}

  const mk = p => { const m = new THREE.Vector3().crossVectors(p.clone().sub(a), cp.n); return m.lengthSq() < 1e-14 ? null : linearAbout(a, reflectL(m)); };
  const b = await getPoint('Fim do plano de espelho', { base: a, exclude: ex, preview: p => { const m = mk(p); return m && previewRecs(recs, m); } });
  const m = mk(b); if (!m) throw new Error('Linha de espelho inválida.');
  return m;
}, { copyDefault: true }));
cmd('Matriz', { label: 'Matriz retangular', alias: ['Array'], cat: 'Transformar', icon: 'array', desc: 'Cópias em linhas, colunas e camadas.' }, async () => {
  const recs = await getObjects('Selecione os objetos para a matriz', () => true);
  const cp = cpA(); const size = recsBox(recs).getSize(V());
  const nx = Math.max(1, Math.round(await getNumber('Número em X', last.arr[0])));
  const ny = Math.max(1, Math.round(await getNumber('Número em Y', last.arr[1])));
  const nz = Math.max(1, Math.round(await getNumber('Número em Z', last.arr[2])));
  last.arr = [nx, ny, nz];
  const sx = nx > 1 ? await getNumber('Espaçamento em X', +fmt(size.dot(cp.x.clone().set(Math.abs(cp.x.x), Math.abs(cp.x.y), Math.abs(cp.x.z))) * 1.5 || 10)) : 0;
  const sy = ny > 1 ? await getNumber('Espaçamento em Y', +fmt(size.dot(cp.y.clone().set(Math.abs(cp.y.x), Math.abs(cp.y.y), Math.abs(cp.y.z))) * 1.5 || 10)) : 0;
  const sz = nz > 1 ? await getNumber('Espaçamento em Z', +fmt(size.dot(cp.n.clone().set(Math.abs(cp.n.x), Math.abs(cp.n.y), Math.abs(cp.n.z))) * 1.5 || 10)) : 0;
  let n = 0;
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    if (!i && !j && !k) continue;
    const t = cp.x.clone().multiplyScalar(i * sx).addScaledVector(cp.y, j * sy).addScaledVector(cp.n, k * sz);
    const m = new THREE.Matrix4().makeTranslation(t.x, t.y, t.z);
    recs.forEach(r => addRec(transformedRec(r, m))); n++;
  }
  res(`${n} cópia(s) criada(s).`);
});
cmd('MatrizPolar', { label: 'Matriz polar', alias: ['ArrayPolar'], cat: 'Transformar', icon: 'arraypolar', desc: 'Cópias em círculo ao redor de um centro.' }, async () => {
  const recs = await getObjects('Selecione os objetos para a matriz polar', () => true);
  const cp = cpA();
  const c = await getPoint('Centro da matriz polar');
  const n = Math.max(2, Math.round(await getNumber('Número de itens', last.polar)));
  const ang = await getNumber('Ângulo total', 360);

  const full = Math.abs(Math.abs(ang) - 360) < 1e-9;
  const step = full ? ang / n : ang / (n - 1);

  res(`${n - 1} cópia(s) criada(s).`);
});

cmd('ReduzirMalha', { label: 'Reduzir malha', alias: ['ReduceMesh'], cat: 'Malha', icon: 'mesh', desc: 'Diminui o número de triângulos mantendo a forma.' }, async () => {
  const recs = await getObjects('Selecione as malhas', isMesh);
  const pct = Math.max(1, Math.min(95, await getNumber('Porcentagem a remover', last.reduce))); last.reduce = pct;
  log('Reduzindo…'); await new Promise(r => setTimeout(r, 20));
  for (const r of recs) {
    let g = new THREE.BufferGeometry(); g.setAttribute('position', r.geom.attributes.position.clone()); g = mergeVertices(g, 1e-5);
    const count = Math.floor(g.attributes.position.count * pct / 100);
    const out = new SimplifyModifier().modify(g, count);
    const before = r.geom.attributes.position.count / 3;
    const ng = finalizeGeom(out);
    replaceRec(r, { ...r, id: nextId++, geom: ng, props: { ...r.props } });
    res(`${fmt(before, 0)} → ${fmt(ng.attributes.position.count / 3, 0)} triângulos`);
  }
});

const unitAbbr = () => ({ 'Milímetros': 'mm', 'Centímetros': 'cm', 'Metros': 'm', 'Polegadas': 'pol' })[doc.units] || '';
const TYPE_LABEL = { polyline: 'Polilinha', nurbs: 'Curva NURBS', interp: 'Curva interpolada', conic: 'Círculo / arco / elipse', point: 'Ponto' };
function describeRec(r) {
  const out = [['Tipo', r.kind === 'mesh' ? (isSolid(r) ? 'Sólido (malha fechada)' : 'Superfície (malha aberta)') : TYPE_LABEL[r.def.type] || r.kind]];
  if (r.kind === 'curve') {
    const S = sampleCurve(r.def);
    out.push(['Fechada', yesNo(isClosedDef(r.def))], ['Comprimento', `${fmt(polyLength(S))} ${unitAbbr()}`]);
    if (r.def.pts) out.push(['Pontos', r.def.pts.length]);
    if (r.def.type === 'conic') { const u = toV(r.def.u).length(), v = toV(r.def.v).length(); out.push(Math.abs(u - v) < 1e-9 ? ['Raio', fmt(u)] : ['Semieixos', `${fmt(u)} / ${fmt(v)}`], ['Centro', fmtV(toV(r.def.c))]); }
  } else if (r.kind === 'point') out.push(['Posição', fmtV(toV(r.def.p))]);
  else {
    const info = meshIsClosed(r.geom);
    out.push(['Triângulos', fmt(r.geom.attributes.position.count / 3, 0)], ['Área', `${fmt(meshArea(r.geom))} ${unitAbbr()}²`]);
    if (isSolid(r)) out.push(['Volume', `${fmt(Math.abs(meshVolume(r.geom)))} ${unitAbbr()}³`]); else out.push(['Arestas abertas', info.naked]);
  }
  const s = recBox(r).getSize(V());
  out.push(['Dimensões', `${fmt(s.x)} × ${fmt(s.y)} × ${fmt(s.z)}`]);
  return out;
}

function f32ToB64(arr) {
  const u8 = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToF32(b) { const s = atob(b), u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return new Float32Array(u8.buffer); }
function serialize(recs = doc.objects) {
  return {
    app: 'Vertice', format: 1, name: doc.name, units: doc.units, current: doc.current,
    layers: doc.layers.map(l => ({ ...l })),
    objects: recs.map(r => ({ kind: r.kind, def: r.def, meta: r.meta, props: r.props, geom: r.geom ? f32ToB64(new Float32Array(r.geom.attributes.position.array)) : undefined })),
  };
}
function geomFromPositions(f32) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(f32, 3)); return finalizeGeom(g); }
function loadDoc(data, name) {
  if (!data || data.app !== 'Vertice' || !Array.isArray(data.objects)) throw new Error('Este arquivo não é um modelo do Vértice.');
  if (input.pending) cancelPending();
  doc.objects = []; doc.layers = []; sel.clear();
  nextLayerId = 1;
  for (const l of data.layers || []) { doc.layers.push({ id: l.id, name: l.name, color: l.color, visible: l.visible !== false, locked: !!l.locked }); nextLayerId = Math.max(nextLayerId, l.id + 1); }
  if (!doc.layers.length) newLayer('Padrão', '#20242a');
  doc.current = layerById(data.current).id;
  doc.units = data.units || 'Milímetros';
  for (const o of data.objects) {
    const r = { id: nextId++, kind: o.kind, def: o.def || null, meta: o.meta || null, geom: o.geom ? geomFromPositions(b64ToF32(o.geom)) : null, props: { name: '', layer: doc.current, color: null, material: 'plastico', matColor: null, hidden: false, locked: false, ...o.props } };
    if (!doc.layers.some(l => l.id === r.props.layer)) r.props.layer = doc.layers[0].id;
    doc.objects.push(r);
  }
  doc.name = name || data.name || 'Sem título';
  undoStack.length = 0; redoStack.length = 0;
  changed(); selectionChanged(); refreshLayers(); refreshStatus(); setDocName();
  setTimeout(() => viewports.forEach(v => v.zoomExtents(visBox())), 0);
}

/* downloads: capacidade do Claude ou download comum fora dele */
const ALLOWED_EXT = ['gif', 'png', 'jpg', 'jpeg', 'webp', 'mp4', 'webm', 'txt', 'json', 'md', 'docx', 'pptx', 'epub', 'csv', 'ttf', 'html', 'svg', 'pdf', 'xlsx', 'zip'];
const inClaude = !!(window.claude && window.claude.use);
const dlReady = inClaude ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, data) {
  let bytes = typeof data === 'string' ? new TextEncoder().encode(data) : data instanceof Uint8Array ? data : new Uint8Array(data.buffer ? data.buffer.slice(data.byteOffset || 0, (data.byteOffset || 0) + data.byteLength) : data);
  const dl = await dlReady;
  if (inClaude) {
    if (!dl) { log('Downloads não estão disponíveis nesta visualização.', 'err'); return; }
    let name = filename;
    if (!ALLOWED_EXT.includes(name.split('.').pop().toLowerCase())) { bytes = zipSync({ [filename]: bytes }); name = filename + '.zip'; log(`O arquivo vai dentro de ${name} (descompacte para usar).`); }
    try { await dl.save({ filename: name, data: new Blob([bytes]) }); log(`Arquivo salvo: ${name}`, 'ok'); }
    catch (e) { if (e && e.code === 'declined') log('Download cancelado.'); else log('Não foi possível salvar: ' + ((e && (e.message || e.code)) || e), 'err'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes]));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  log(`Arquivo salvo: ${filename}`, 'ok');
}

/* rhino3dm (.3dm) — carregado sob demanda */
let rhinoP = null;
function loadRhino() {
  if (!rhinoP) rhinoP = import('https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/rhino3dm.module.min.js').then(m => (m.default || m)()).catch(e => { rhinoP = null; throw e; });
  return rhinoP;
}
const RHINO_FAIL = 'Não foi possível carregar o leitor de .3dm aqui (ele precisa baixar um módulo WebAssembly, o que esta visualização bloqueia). Abra o Vértice como arquivo local para usar .3dm, ou troque arquivos por OBJ/STL/GLB.';

const ZUP_TO_YUP = new THREE.Matrix4().makeRotationX(-Math.PI / 2);
const YUP_TO_ZUP = new THREE.Matrix4().makeRotationX(Math.PI / 2);
function exportScene(recs, withCurves) {
  const grp = new THREE.Group();
  for (const r of recs) {
    if (r.kind === 'mesh') {
      const p = PRESETS[r.props.material] || PRESETS.plastico;
      const m = new THREE.Mesh(r.geom, new THREE.MeshStandardMaterial({ color: surfColor(r), roughness: p.roughness ?? 0.5, metalness: p.metalness ?? 0, transparent: !!p.transmission, opacity: p.transmission ? 0.35 : 1 }));
      m.name = r.props.name || `${layerById(r.props.layer).name}_${r.id}`; grp.add(m);
    } else if (withCurves && r.kind === 'curve') {
      const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(sampleCurve(r.def)), new THREE.LineBasicMaterial({ color: objColor(r) }));
      l.name = r.props.name || `curva_${r.id}`; grp.add(l);
    }
  }
  return grp;
}
async function exportFormat(fmtKey, recs) {
  const base = (doc.name || 'modelo').replace(/[^\wÀ-ú\- ]+/g, '').trim() || 'modelo';
  const meshes = recs.filter(isMesh);
  if (['stl', 'ply'].includes(fmtKey) && !meshes.length) throw new Error('Não há superfícies ou sólidos para exportar.');
  if (fmtKey === 'json') return saveFile(`${base}.vertice.json`, JSON.stringify(serialize(recs)));
  if (fmtKey === 'obj') {
    const grp = exportScene(recs, true); grp.applyMatrix4(ZUP_TO_YUP); grp.updateMatrixWorld(true);
    return saveFile(`${base}.obj`, new OBJExporter().parse(grp));
  }
  if (fmtKey === 'stl') {
    const grp = exportScene(meshes, false); grp.updateMatrixWorld(true);
    const dv = new STLExporter().parse(grp, { binary: true });
    return saveFile(`${base}.stl`, new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength));
  }
  if (fmtKey === 'glb') {
    const grp = exportScene(recs, true); grp.applyMatrix4(ZUP_TO_YUP); grp.updateMatrixWorld(true);
    const buf = await new Promise((ok, bad) => new GLTFExporter().parse(grp, ok, bad, { binary: true }));
    return saveFile(`${base}.glb`, new Uint8Array(buf));
  }
  if (fmtKey === 'ply') {
    const grp = exportScene(meshes, false); grp.updateMatrixWorld(true);
    const buf = await new Promise(ok => new PLYExporter().parse(grp, ok, { binary: true }));
    return saveFile(`${base}.ply`, new Uint8Array(buf));
  }
  if (fmtKey === '3dm') {
    let rh; try { rh = await loadRhino(); } catch (e) { throw new Error(RHINO_FAIL); }
    const bytes = build3dm(rh, recs);
    return saveFile(`${base}.3dm`, bytes);
  }
}
function build3dm(rh, recs) {
  const f = new rh.File3dm();
  const layerIdx = new Map();
  for (const l of doc.layers) {
    const L = new rh.Layer(); L.name = l.name; const c = new THREE.Color(l.color); L.color = { r: Math.round(c.r * 255), g: Math.round(c.g * 255), b: Math.round(c.b * 255), a: 255 };
    layerIdx.set(l.id, f.layers().add(L));
  }
  for (const r of recs) {
    const att = new rh.ObjectAttributes();
    att.layerIndex = layerIdx.get(r.props.layer) ?? 0;
    if (r.props.name) att.name = r.props.name;
    if (r.props.color) { const c = new THREE.Color(r.props.color); att.colorSource = rh.ObjectColorSource.ColorFromObject; att.objectColor = { r: Math.round(c.r * 255), g: Math.round(c.g * 255), b: Math.round(c.b * 255), a: 255 }; }
    if (r.kind === 'mesh') {
      let g = new THREE.BufferGeometry(); g.setAttribute('position', r.geom.attributes.position.clone()); g = mergeVertices(g, 1e-6);
      const json = { data: { attributes: { position: { itemSize: 3, type: 'Float32Array', array: Array.from(g.attributes.position.array) } }, index: { type: 'Uint32Array', array: Array.from(g.index.array) } } };
      const m = rh.Mesh.createFromThreejsJSON(json);
      m.normals().computeNormals(); m.compact();
      f.objects().add(m, att);
    } else if (r.kind === 'point') {
      f.objects().add(new rh.Point(r.def.p), att);
    } else {
      const d = r.def; let crv = null;
      const plist = pts => { const l = new rh.Point3dList(); pts.forEach(q => l.add(q[0], q[1], q[2])); return l; };
      if (d.type === 'polyline') { const P = d.pts.slice(); if (d.closed) P.push(P[0]); crv = rh.NurbsCurve.create(false, 1, plist(P)); }
      else if (d.type === 'nurbs') crv = rh.NurbsCurve.create(!!d.closed, Math.min(d.degree || 3, d.pts.length - 1), plist(d.pts));
      else if (d.type === 'conic' && Math.abs(toV(d.u).length() - toV(d.v).length()) < 1e-9 && isClosedDef(d)) {
        const u = toV(d.u), v = toV(d.v);
        try { const ci = new rh.Circle(d.c, u.length()); ci.plane = { origin: d.c, xAxis: toA(u.clone().normalize()), yAxis: toA(v.clone().normalize()), zAxis: toA(new THREE.Vector3().crossVectors(u, v).normalize()) }; crv = ci.toNurbsCurve(); } catch (e) { crv = null; }
      }
      if (!crv) { const S = sampleCurve(d); const R = resample(S, Math.min(200, S.length)); crv = rh.NurbsCurve.create(false, Math.min(3, R.length - 1), plist(R.map(toA))); }
      if (crv) f.objects().add(crv, att);

}
function read3dm(rh, buf, layerName) {
  const f = rh.File3dm.fromByteArray(new Uint8Array(buf));
  if (!f) throw new Error('Arquivo .3dm inválido.');
  const lmap = new Map();
  const layers = f.layers();
  for (let i = 0; i < layers.count; i++) {
    const L = layers.get(i); const c = L.color;
    const nl = newLayer(L.name || `${layerName} ${i}`, '#' + new THREE.Color(c.r / 255, c.g / 255, c.b / 255).getHexString());
    lmap.set(i, nl.id);
  }
  const objs = f.objects(); let n = 0, skipped = 0;
  const T = rh.ObjectType;
  for (let i = 0; i < objs.count; i++) {
    const o = objs.get(i); const g = o.geometry(); const a = o.attributes();
    const props = { layer: lmap.get(a.layerIndex) ?? doc.current, name: a.name || '' };
    const toThree = mesh => { const j = mesh.toThreejsJSON(); const geo = new THREE.BufferGeometryLoader().parse(j); return finalizeGeom(geo); };
    try {
      const type = g.objectType;
      if (type === T.Mesh) { addRec(meshRec(toThree(g), null, props)); n++; }
      else if (type === T.Brep) {
        let any = false; const faces = g.faces();
        for (let k = 0; k < faces.count; k++) { const m = faces.get(k).getMesh(rh.MeshType.Any); if (m) { addRec(meshRec(toThree(m), null, props)); any = true; } }
        if (any) n++; else skipped++;
      } else if (type === T.Extrusion) { const m = g.getMesh(rh.MeshType.Any); if (m) { addRec(meshRec(toThree(m), null, props)); n++; } else skipped++; }
      else if (type === T.Point) { const p = g.location; addRec(pointRec(V(p[0], p[1], p[2]), props)); n++; }
      else if (type === T.Curve) {
        const dom = g.domain; const P = []; const N = 120;
        for (let k = 0; k <= N; k++) { const p = g.pointAt(dom[0] + (dom[1] - dom[0]) * k / N); P.push(p); }
        const closed = g.isClosed;
        if (g.degree === 1 || g.isPolyline && g.isPolyline()) {
          const nc = g.toNurbsCurve(); const pts = []; const cps = nc.points(); for (let k = 0; k < cps.count; k++) { const q = cps.get(k); pts.push([q[0], q[1], q[2]]); }
          if (closed && pts.length > 2) pts.pop();
          addRec(curveRec({ type: 'polyline', pts, closed }, props));
        } else addRec(curveRec({ type: 'interp', pts: (closed ? P.slice(0, -1) : P).filter((_, k) => k % 3 === 0 || k === P.length - 1), closed }, props));
        n++;
      } else skipped++;
    } catch (e) { console.warn(e); skipped++; }
  }
  return { n, skipped };
}

function importMeshesFromObject(root, yUp, props) {
  root.updateMatrixWorld(true); let n = 0;
  root.traverse(o => {
    if (o.isMesh && o.geometry && o.geometry.attributes.position) {
      const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); if (yUp) g.applyMatrix4(YUP_TO_ZUP);
      addRec(meshRec(finalizeGeom(g), null, { ...props, name: o.name || '' })); n++;
    } else if ((o.isLine || o.isLineSegments) && o.geometry && o.geometry.attributes.position) {
      const p = o.geometry.attributes.position; const pts = [];
      for (let i = 0; i < p.count; i++) { const v = V(p.getX(i), p.getY(i), p.getZ(i)).applyMatrix4(o.matrixWorld); if (yUp) v.applyMatrix4(YUP_TO_ZUP); pts.push(toA(v)); }
      if (pts.length >= 2) { addRec(curveRec({ type: 'polyline', pts, closed: false }, props)); n++; }

async function importFile(file, replace) {
  const ext = file.name.split('.').pop().toLowerCase();
  const stem = file.name.replace(/\.[^.]+$/, '').replace(/\.vertice$/, '');
  if (ext === 'json') {
    const data = JSON.parse(await file.text());
    if (replace) { loadDoc(data, stem); res(`Aberto: ${file.name}`); return; }
    const before = doc.objects.length;
    const lmap = new Map();
    for (const l of data.layers || []) { const ex = doc.layers.find(x => x.name === l.name); lmap.set(l.id, ex ? ex.id : newLayer(l.name, l.color).id); }
    for (const o of data.objects || []) addRec({ id: nextId++, kind: o.kind, def: o.def || null, meta: o.meta || null, geom: o.geom ? geomFromPositions(b64ToF32(o.geom)) : null, props: { ...o.props, layer: lmap.get(o.props.layer) ?? doc.current } });
    res(`${doc.objects.length - before} objeto(s) importado(s).`); refreshLayers(); return;
  }
  if (replace) { doc.objects.slice().forEach(removeRec); doc.name = stem; setDocName(); }
  const layer = newLayer(stem.slice(0, 40), '#3a6ea5'); doc.current = layer.id;
  const props = { layer: layer.id };
  let n = 0;
  if (ext === 'obj') n = importMeshesFromObject(new OBJLoader().parse(await file.text()), true, props);
  else if (ext === 'stl') { addRec(meshRec(finalizeGeom(new STLLoader().parse(await file.arrayBuffer())), null, props)); n = 1; }
  else if (ext === 'ply') { addRec(meshRec(finalizeGeom(new PLYLoader().parse(await file.arrayBuffer())), null, props)); n = 1; }
  else if (ext === 'glb' || ext === 'gltf') {
    const buf = ext === 'glb' ? await file.arrayBuffer() : await file.text();
    const gltf = await new Promise((ok, bad) => new GLTFLoader().parse(buf, '', ok, bad));
    n = importMeshesFromObject(gltf.scene, true, props);
  } else if (ext === '3dm') {
    let rh; try { rh = await loadRhino(); } catch (e) { throw new Error(RHINO_FAIL); }
    doc.layers.splice(doc.layers.indexOf(layer), 1);
    const r = read3dm(rh, await file.arrayBuffer(), stem);
    n = r.n; if (r.skipped) log(`${r.skipped} objeto(s) sem malha de renderização foram ignorados. No Rhino, salve com "Salvar malhas de renderização" ligado.`, 'err');
    doc.current = doc.layers[doc.layers.length - 1]?.id || doc.current;
  } else throw new Error(`Formato .${ext} não suportado. Use .json, .obj, .stl, .glb, .gltf, .ply ou .3dm.`);
  refreshLayers();
  res(`${n} objeto(s) importado(s) de ${file.name}.`);
  setTimeout(() => viewports.forEach(v => v.zoomExtents(visBox())), 0);
}
function pickFile(accept) {
  const fi = document.getElementById('filein');
  fi.accept = accept; fi.value = '';
  const p = ask('file', 'Escolha um arquivo (Esc cancela)');
  const onChange = () => { cleanup(); if (fi.files[0]) finishPending(fi.files[0]); else cancelPending(); };
  const onCancel = () => { cleanup(); cancelPending(); };
  const cleanup = () => { fi.removeEventListener('change', onChange); fi.removeEventListener('cancel', onCancel); };
  fi.addEventListener('change', onChange); fi.addEventListener('cancel', onCancel);
  fi.click();
  return p;
}

let openDrop = null;
function closeMenus() { if (openDrop) { openDrop.remove(); openDrop = null; } document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
function dropdown(anchor, items) {
  closeMenus();
  const d = document.createElement('div'); d.className = 'dropdown'; d.setAttribute('role', 'menu');
  for (const it of items) {
    if (it === '-') { d.appendChild(document.createElement('hr')); continue; }
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
    b.innerHTML = `<span><span class="chk">${it.checked ? '✓' : ''}</span> ${it.label}</span>${it.key ? `<kbd>${it.key}</kbd>` : ''}`;
    if (it.checked) b.classList.add('on');
    b.addEventListener('click', () => { closeMenus(); it.run(); });
    d.appendChild(b);
  }
  document.body.appendChild(d);
  const r = anchor.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - d.offsetWidth - 8);
  d.style.left = Math.max(8, left) + 'px'; d.style.top = (r.bottom + 2) + 'px';
  openDrop = d;
  const first = d.querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function buildMenus() {
  const host = $('menus');
  for (const [title, names] of MENUS) {
    const m = document.createElement('div'); m.className = 'menu';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = title;
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (m.classList.contains('open')) return closeMenus();
      dropdown(b, names.map(n => n === '-' ? '-' : (c => c && { label: c.label, key: c.key, run: () => runCommand(c.name) })(findCmd(n))).filter(Boolean));
      m.classList.add('open');
    });
    b.addEventListener('mouseenter', () => { if (openDrop && !m.classList.contains('open')) b.click(); });
    m.appendChild(b); host.appendChild(m);
  }
  document.addEventListener('pointerdown', e => { if (openDrop && !openDrop.contains(e.target) && !e.target.closest('.menu') && !e.target.closest('.vp-label')) closeMenus(); });
}
function openViewMenu(vp, anchor) {
  const items = [];
  for (const [k, l] of Object.entries(MODES)) items.push({ label: l, checked: vp.mode === k, run: () => { vp.setMode(k); refreshToolbarState(); } });
  items.push('-');

  items.push('-');

}

function renderCmdList() {
  const q = norm($('cmdsearch').value.trim());
  const cats = new Map();
  for (const c of CMDS) {
    if (q && ![c.name, c.label, c.desc, ...c.alias].some(s => norm(s).includes(q))) continue;
    if (!cats.has(c.cat)) cats.set(c.cat, []); cats.get(c.cat).push(c);
  }
  const host = $('cmdlist'); host.innerHTML = '';
  for (const [cat, list] of cats) {
    const h = document.createElement('div'); h.className = 'cmdgrp'; h.textContent = cat; host.appendChild(h);
    for (const c of list) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cmditem';
      b.innerHTML = `${svg(c.icon)}<div><b>${esc(c.label)}</b><code>${esc(c.alias[0] || c.name)}</code><span>${esc(c.desc)}</span></div>`;
      b.addEventListener('click', () => { runCommand(c.name); if (matchMedia('(max-width:820px)').matches) $('panel').classList.remove('open'); });
      host.appendChild(b);
    }
  }
  if (!host.children.length) host.innerHTML = '<p class="empty">Nenhum comando encontrado.</p>';
}

/* autocompletar */
let acIdx = 0, acItems = [];
function hideAC() { $('ac').hidden = true; acItems = []; }
function updateAC() {
  const v = $('cmd').value;
  const P = input.pending;
  if (!v || /\s/.test(v) || P || /^[-\d.@r<,]/i.test(v) && /\d/.test(v)) return hideAC();
  const q = norm(v);
  const seen = new Set(); acItems = [];
  for (const c of CMDS) {
    if (seen.has(c)) continue;
    const keys = [c.name, c.label.replace(/\s+/g, ''), ...c.alias];
    const hit = keys.find(k => norm(k).startsWith(q));
    if (hit) { seen.add(c); acItems.push({ c, hit }); }
  }
  acItems.sort((a, b) => a.hit.length - b.hit.length);
  acItems = acItems.slice(0, 9);
  if (!acItems.length) return hideAC();
  acIdx = 0; renderAC();
}
function renderAC() {
  const ul = $('ac'); ul.innerHTML = '';
  acItems.forEach((it, i) => {
    const li = document.createElement('li'); if (i === acIdx) li.className = 'on';
    li.innerHTML = `<b>${esc(it.hit)}</b><span>${esc(it.c.label)} — ${esc(it.c.desc)}</span>`;
    li.addEventListener('mousedown', e => { e.preventDefault(); $('cmd').value = ''; hideAC(); runCommand(it.c.name); });
    ul.appendChild(li);
  });
  ul.hidden = false;
}

/* teclado */
function bindKeys() {
  const ci = $('cmd');
  ci.addEventListener('input', updateAC);
  ci.addEventListener('blur', () => setTimeout(hideAC, 120));
  document.addEventListener('keydown', e => {
    const t = e.target, inCmd = t === ci, inOther = !inCmd && /INPUT|TEXTAREA|SELECT/.test(t.tagName);
    const ctrl = e.ctrlKey || e.metaKey, k = e.key;
    if (inOther) { if (k === 'Escape') t.blur(); return; }
    if (k === 'Escape') { e.preventDefault(); hideAC(); if (openDrop) return closeMenus(); if (ci.value) { ci.value = ''; return; } cancelAll(); return; }
    if (ctrl && !e.altKey) {
      const kk = k.toLowerCase();
      if (kk === 'z' && !e.shiftKey) { e.preventDefault(); if (!input.pending) runCommand('Desfazer'); return; }
      if (kk === 'y' || (kk === 'z' && e.shiftKey)) { e.preventDefault(); if (!input.pending) runCommand('Refazer'); return; }
      if (kk === 'a' && !(inCmd && ci.value)) { e.preventDefault(); runCommand('SelTudo'); return; }
      if (kk === 's') { e.preventDefault(); runCommand('Salvar'); return; }
      if (kk === 'o') { e.preventDefault(); runCommand('Abrir'); return; }
      if (kk === 'c' && !(inCmd && ci.value)) { copySel(); return; }
      if (kk === 'v' && !(inCmd && ci.value)) { e.preventDefault(); pasteClip(); return; }
      return;
    }
    if (k === 'F8') { e.preventDefault(); runCommand('Orto'); return; }
    if (k === 'F9') { e.preventDefault(); runCommand('SnapGrade'); return; }
    if (acItems.length && inCmd) {
      if (k === 'ArrowDown') { e.preventDefault(); acIdx = (acIdx + 1) % acItems.length; renderAC(); return; }
      if (k === 'ArrowUp') { e.preventDefault(); acIdx = (acIdx - 1 + acItems.length) % acItems.length; renderAC(); return; }
      if (k === 'Tab') { e.preventDefault(); ci.value = acItems[acIdx].hit; hideAC(); return; }
    }
    if (k === 'Enter' || (k === ' ' && (inCmd || !t.closest('button')))) {
      if (!inCmd && t.closest && t.closest('button, .dropdown')) return;
      e.preventDefault();
      let v = ci.value;
      if (acItems.length && !input.pending) { v = acItems[acIdx].c.name; }
      ci.value = ''; hideAC();
      onEnter(v);
      return;
    }
    if (!inCmd && (k === 'Delete' || k === 'Backspace')) { e.preventDefault(); if (!input.pending && sel.size) runCommand('Excluir'); return; }
    if (!inCmd && gumball && !input.pending && ['w', 'e', 'r'].includes(k.toLowerCase()) && !ci.value) {
      settings.gumballMode = { w: 'translate', e: 'rotate', r: 'scale' }[k.toLowerCase()]; gumball.setMode(settings.gumballMode); markDirty(); return;
    }
    if (!inCmd && k.length === 1 && !e.altKey) { ci.focus({ preventScroll: true }); }
    if (!inCmd && k === 'ArrowUp' && lastCmd) { ci.focus(); ci.value = lastCmd; e.preventDefault(); }
  });
}

function buildSample() {
  defaultLayers();
  const L = n => doc.layers.find(l => l.name === n).id;
  // vaso: perfil interpolado + revolução
  const prof = [[18, 0, 0], [24, 0, 10], [21, 0, 26], [13, 0, 38], [12, 0, 48], [15, 0, 56]].map(([x, y, z]) => [x - 45, y, z]);
  const profRec = addRec(curveRec({ type: 'interp', pts: prof, closed: false }, { layer: L('Curvas'), name: 'Perfil do vaso' }));
  const axisA = V(-45, 0, 0), axisB = V(-45, 0, 60);
  addRec(curveRec({ type: 'polyline', pts: [toA(axisA), toA(axisB)], closed: false }, { layer: L('Auxiliar'), name: 'Eixo' }));
  const vase = revolvePts(sampleCurve(profRec.def), axisA, axisB, 360);
  addRec(meshRec(vase, { snaps: [{ t: 'cen', p: toA(axisA) }] }, { layer: L('Superfícies'), name: 'Vaso', material: 'ceramica', matColor: '#2f6f8f' }));
  // bloco com furo (diferença booleana)
  const blk = makeBox(V(-12, -15, 0), V(30, 0, 0), V(0, 30, 0), V(0, 0, 14));
  const hole = makeCylinder(V(3, 0, -2), V(0, 0, 1), 8, 18);
  const g = booleanOp([blk], [hole], SUBTRACTION) || blk;
  addRec(meshRec(g, { solid: true, snaps: [{ t: 'cen', p: [3, 0, 14] }] }, { layer: L('Sólidos'), name: 'Bloco com furo', material: 'metal' }));
  addRec(curveRec(circleDef(V(3, 0, 14), { x: V(1, 0, 0), y: V(0, 1, 0) }, 8), { layer: L('Curvas'), name: 'Borda do furo' }));
  // anel
  addRec(meshRec(makeTorus(V(48, 0, 2.2), V(0, 0, 1), 9.5, 2.2), { snaps: [{ t: 'cen', p: [48, 0, 2.2] }] }, { layer: L('Sólidos'), name: 'Anel', material: 'ouro' }));
  addRec(meshRec(makeSphere(V(48, -9.5, 6.2), 2.6), null, { layer: L('Sólidos'), name: 'Pedra', material: 'vidro', matColor: '#d7f1ff' }));
  // hélice + tubo
  const hp = []; for (let i = 0; i <= 36; i++) { const a = TAU * 3 * i / 36; hp.push([5 * Math.cos(a) + 3, 5 * Math.sin(a) + 34, 3 + 22 * i / 36]); }
  const hel = addRec(curveRec({ type: 'interp', pts: hp, closed: false }, { layer: L('Curvas'), name: 'Mola (trilho)' }));
  addRec(meshRec(pipe(sampleCurve(hel.def), 0.9, true), null, { layer: L('Superfícies'), name: 'Mola', material: 'cobre' }));
  doc.name = 'Exemplo';
  undoStack.length = 0; redoStack.length = 0;
}
function onTheme() { readTheme(); viewports.forEach(v => v.buildGrid()); markDirty(); }

function init() {

  const saved = loadAutosave();

  if (!restored) { try { buildSample(); } catch (e) { console.error(e); if (!doc.layers.length) defaultLayers(); } }
  changed(); refreshLayers(); refreshStatus(); setDocName(); selectionChanged();
  requestAnimationFrame(() => { viewports.forEach(v => { v.resize(); v.zoomExtents(visBox()); }); markDirty(); });
  log('Vértice pronto. Digite um comando ou escolha uma ferramenta à esquerda.', 'ok');
  if (restored) log('Seu último modelo foi recuperado deste navegador. Use Novo para começar outro.');
  else log('Este é um modelo de exemplo: vaso por revolução, bloco com furo booleano, anel com pedra e mola por tubo. Use Novo para começar do zero.');
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

}
